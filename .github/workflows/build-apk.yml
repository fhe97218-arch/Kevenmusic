name: Build KEVEN Music APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Buscar proyecto KEVEN Music
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -name 'KEVEN_Music_FINAL_1.0.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No se encontró KEVEN_Music_FINAL_1.0.zip"
            exit 1
          fi

          mkdir -p keven_project
          unzip -q "$ZIP_FILE" -d keven_project

          PUBSPEC=$(find keven_project -type f -name 'pubspec.yaml' | head -n 1)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: No se encontró pubspec.yaml"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "Proyecto encontrado: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Instalar dependencias
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Construir APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: KEVEN-Music-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
